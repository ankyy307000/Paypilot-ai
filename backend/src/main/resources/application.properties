spring.application.name=paypilot-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/paypilot
spring.datasource.username=paypilot
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

gemini.api.key=${GOOGLE_API_KEY}

paypal.base-url=https://api-m.sandbox.paypal.com
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}

# Persistent local database
spring.datasource.url=jdbc:h2:file:./data/paypilot;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Database schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Local development only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console